[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
# Let-chains and `as_chunks` are both 1.88. Written down rather than inferred
# from the edition, which would say 1.85 and be wrong.
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/desFernan/wisp"
homepage = "https://github.com/desFernan/wisp"
authors = ["desFernan"]
# crates.io allows five, of twenty characters each. These are what somebody
# with this problem would actually type into the search box.
keywords = ["gui", "overlay", "gpu", "wgpu", "transparent"]
categories = ["gui", "graphics", "rendering"]

[workspace.dependencies]
wisp-core = { path = "crates/wisp-core", version = "0.0.1" }
wisp-text = { path = "crates/wisp-text", version = "0.0.1" }
wisp-ui = { path = "crates/wisp-ui", version = "0.0.1" }
wisp-overlay = { path = "crates/wisp-overlay", version = "0.0.1" }
