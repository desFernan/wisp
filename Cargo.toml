[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/desFernan/wisp"
authors = ["desFernan"]

[workspace.dependencies]
wisp-core = { path = "crates/wisp-core", version = "0.0.1" }
wisp-text = { path = "crates/wisp-text", version = "0.0.1" }
wisp-ui = { path = "crates/wisp-ui", version = "0.0.1" }
wisp-overlay = { path = "crates/wisp-overlay", version = "0.0.1" }
