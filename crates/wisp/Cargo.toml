[package]
name = "wisp"
description = "A GPU user interface toolkit built around transparent, click-through, always-on-top windows."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
wisp-core.workspace = true
wisp-gpu = { path = "../wisp-gpu", version = "0.0.1" }
wisp-text.workspace = true
wisp-ui.workspace = true
wgpu = "30"
winit = "0.30"
pollster = "0.4"
anyhow = "1"
raw-window-handle = "0.6"
png = { version = "0.17", optional = true }

[features]
default = ["snapshot"]
# Rendering a frame to a file with no window. Small, and the only honest way
# to check what a toolkit draws.
snapshot = ["dep:png"]

[target.'cfg(target_os = "macos")'.dependencies]
wisp-overlay.workspace = true
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSView", "NSResponder"] }

[dev-dependencies]
winit = "0.30"
